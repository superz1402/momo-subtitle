# Momo Subtitle — Gradle configuration
# Heap + worker limits tuned for 4 GB build hosts (AGENTS.md: server-first builds).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1280m
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
